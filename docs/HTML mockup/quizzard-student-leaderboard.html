<!-- NOTE: This is an outdated mockup from the early design phase. -->
<!-- The actual UI has been implemented in React (Next.js App Router). -->
<!-- This file is kept for reference only and may not reflect current behavior. -->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quizzard – Bảng xếp hạng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] } } } }
</script>
<style>
  html, body { font-family: 'Inter', ui-sans-serif, system-ui; }
  *:focus-visible { outline: 2px solid #4F46E5; outline-offset: 2px; border-radius: 6px; }
  .vtab.active { background:#fff; color:#3730A3; box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.06); }
</style>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-50 text-slate-900 antialiased">
  <div class="flex h-full">

    <aside class="w-60 shrink-0 bg-white border-r border-slate-200 flex flex-col h-full">
      <div class="p-5 flex items-center gap-2.5 border-b border-slate-100">
        <svg width="26" height="26" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="8" fill="#4F46E5"/><path d="M8 14.5L12 18.5L20 9.5" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="text-base font-semibold tracking-tight">Quizzard</span>
      </div>
      <nav class="flex-1 p-3 space-y-1">
        <a href="quizzard-student-dashboard.html" class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-500 hover:bg-slate-50 transition">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 3l7 3.5-7 3.5-7-3.5L10 3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M3 10.5l7 3.5 7-3.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M3 14l7 3.5 7-3.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          Lớp đã tham gia
        </a>
      </nav>
    </aside>

    <main class="flex-1 overflow-y-auto">
      <header class="border-b border-slate-200 px-8 pt-5 pb-5 bg-white">
        <a href="quizzard-student-quiz-list.html" class="inline-flex items-center gap-1.5 text-xs text-slate-400 hover:text-slate-600 mb-2">
          <svg width="12" height="12" viewBox="0 0 20 20" fill="none"><path d="M16 10H4M9 5l-5 5 5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Cơ sở dữ liệu – Nhóm 1
        </a>
        <h1 class="text-xl font-semibold mb-4">Bảng xếp hạng</h1>
        <div class="flex items-center justify-between">
          <div class="flex gap-1 bg-slate-100 rounded-lg p-1 w-fit">
            <button onclick="showView('total')" id="vtab-total" class="vtab active px-4 py-2 rounded-md text-sm font-medium text-slate-500">Tổng điểm cả lớp</button>
            <button onclick="showView('quiz')" id="vtab-quiz" class="vtab px-4 py-2 rounded-md text-sm font-medium text-slate-500">Theo bài giảng</button>
          </div>
          <select id="lecture-select" onchange="showView('quiz')" class="hidden text-sm border border-slate-300 rounded-lg px-3 py-2 focus:border-indigo-500">
            <option>Buổi 1 – Mô hình quan hệ &amp; ràng buộc</option>
            <option>Buổi 2 – Đại số quan hệ</option>
            <option selected>Buổi 3 – Chuẩn hoá CSDL</option>
          </select>
        </div>
      </header>

      <div class="p-8 max-w-2xl">
        <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-xs text-slate-400 uppercase tracking-wide">
              <tr><th class="text-left px-5 py-3 w-16">Hạng</th><th class="text-left px-5 py-3">Sinh viên</th><th class="text-left px-5 py-3">Điểm</th></tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              <tr>
                <td class="px-5 py-3"><span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-amber-100 text-amber-700 text-xs font-bold">1</span></td>
                <td class="px-5 py-3 font-medium">Phạm Thu Trang</td>
                <td class="px-5 py-3 font-semibold">18.5</td>
              </tr>
              <tr>
                <td class="px-5 py-3"><span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-200 text-slate-600 text-xs font-bold">2</span></td>
                <td class="px-5 py-3">Lê Quốc Bảo</td>
                <td class="px-5 py-3 font-semibold">17.4</td>
              </tr>
              <tr>
                <td class="px-5 py-3"><span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-orange-100 text-orange-700 text-xs font-bold">3</span></td>
                <td class="px-5 py-3">Đỗ Minh Khuê</td>
                <td class="px-5 py-3 font-semibold">16.5</td>
              </tr>
              <tr><td class="px-5 py-3 text-slate-500">4</td><td class="px-5 py-3">Ngô Bảo Châu</td><td class="px-5 py-3">16.0</td></tr>
              <tr class="bg-indigo-50/60">
                <td class="px-5 py-3 text-indigo-700 font-medium">5</td>
                <td class="px-5 py-3 font-medium text-indigo-700">Trần Văn Long <span class="text-[10px] font-medium bg-indigo-600 text-white rounded-full px-1.5 py-0.5 ml-1">Bạn</span></td>
                <td class="px-5 py-3 font-semibold text-indigo-700">15.5</td>
              </tr>
              <tr><td class="px-5 py-3 text-slate-500">6</td><td class="px-5 py-3">Vũ Thị Hằng</td><td class="px-5 py-3">15.0</td></tr>
              <tr><td class="px-5 py-3 text-slate-500">7</td><td class="px-5 py-3">Đặng Quốc Anh</td><td class="px-5 py-3">14.2</td></tr>
              <tr class="opacity-60"><td class="px-5 py-3 text-slate-500">…</td><td class="px-5 py-3">28 sinh viên</td><td class="px-5 py-3"></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    function showView(v) {
      document.getElementById('vtab-total').classList.toggle('active', v === 'total');
      document.getElementById('vtab-quiz').classList.toggle('active', v === 'quiz');
      document.getElementById('lecture-select').classList.toggle('hidden', v !== 'quiz');
    }
  </script>
</body>
</html>
